; ============================================================================
;  gbemu — Game Boy (DMG) эмулятор для консоли RP2040 + ST7789 240x240
;
;  Сборка:  pio run                     -> .pio/build/pico/firmware.uf2
;  Заливка: pio run -t upload           (устройство в режиме BOOTSEL)
;  Монитор: pio device monitor -b 115200
;
;  ВАЖНО: положите сгенерированный rom.h в папку src/ (заменив заглушку),
;  иначе скетч соберётся, но покажет «NO ROM».
;
;  Разгон и оптимизация: ОБЯЗАТЕЛЬНЫ для скорости (250 МГц CPU и -O3).
;  В Arduino IDE то же самое: Tools -> CPU Speed -> 250 MHz,
;  Tools -> Optimize -> Fastest (-O3).
;  Сторожа в коде (F_CPU + __OPTIMIZE_SIZE__) не дадут тихо собрать медленный билд.
; ============================================================================

[env:pico]
; v9.2: платформа ЗАФИКСИРОВАНА на теге (плавающий master давал разные ядра
; от сборки к сборке — так v9.1 тихо уехал на 133 МГц с -Os).
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#v1.4.0-gcc14-arduinopico460
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
; v9.2: частота — штатной опцией платформы (свой -DF_CPU в build_flags платформа
; перебивала своим 133 МГц — кто последний, тот и прав, а последним были не мы).
board_build.f_cpu = 250000000L

; --- оптимизация: сначала снимаем дефолтный -Os платформы, потом ставим -O3 ---
build_unflags = -Os
build_flags =
    -O3

monitor_speed = 115200
upload_protocol = picotool
