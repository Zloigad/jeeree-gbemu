name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests (harness + sanitizers + APU)
        run: bash tools/check_all.sh

  firmware:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: platformio run -d gbemu_pio
      - name: Package
        run: |
          V=$(grep '#define GBEMU_BUILD' gbemu/gbemu.ino | head -1 | sed 's/^[^"]*"\([^"]*\)".*/\1/')
          if [ -z "$V" ]; then echo "version extract failed"; exit 1; fi
          echo "build version: $V"
          cp gbemu_pio/.pio/build/pico/firmware.uf2 "gbemu_${V}_jeeree.uf2"
          python3 tools/pack_roms_kit.py jeeree_roms_kit.zip
          sha256sum "gbemu_${V}_jeeree.uf2" jeeree_roms_kit.zip > SHA256SUMS.txt
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: |
            gbemu_*_jeeree.uf2
            jeeree_roms_kit.zip
            SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test, firmware ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
