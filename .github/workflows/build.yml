name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests (harness + sanitizers + APU)
        run: bash tools/check_all.sh

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: python3 -m platformio run -d gbemu_pio
      - name: Rename artifact
        run: |
          V=$(grep -o 'GBEMU_BUILD "[^"]*"' gbemu/gbemu.ino | cut -d'"' -f2)
          cp gbemu_pio/.pio/build/pico/firmware.uf2 "gbemu_${V}_jeeree.uf2"
          sha256sum "gbemu_${V}_jeeree.uf2" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: |
            gbemu_*_jeeree.uf2
            SHA256SUMS.txt

  # На теге v* собираем релиз и прикладываем бинарники автоматически
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gbemu_*_jeeree.uf2
            SHA256SUMS.txt
          generate_release_notes: true
